<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const container = document.getElementById('hero-3d-container') || document.body;
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create an ambient node network representing "information flow"
const group = new THREE.Group();
scene.add(group);

const pointsCount = 150;
const positions = new Float32Array(pointsCount * 3);
const colors = new Float32Array(pointsCount * 3);
const tealColor = new THREE.Color('#008080');
const whiteColor = new THREE.Color('#dadada');

for (let i = 0; i < pointsCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 10;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
  
  const mix = Math.random();
  colors[i * 3] = THREE.MathUtils.lerp(whiteColor.r, tealColor.r, mix);
  colors[i * 3 + 1] = THREE.MathUtils.lerp(whiteColor.g, tealColor.g, mix);
  colors[i * 3 + 2] = THREE.MathUtils.lerp(whiteColor.b, tealColor.b, mix);
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.05,
  vertexColors: true,
  transparent: true,
  opacity: 0.6
});

const points = new THREE.Points(geometry, material);
group.add(points);

// Add faint lines connecting nearby nodes
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x008080, transparent: true, opacity: 0.1 });
const lineGeometry = new THREE.BufferGeometry();
const linePositions = [];

for (let i = 0; i < pointsCount; i++) {
  for (let j = i + 1; j < pointsCount; j++) {
    const dx = positions[i * 3] - positions[j * 3];
    const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
    const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist < 1.5) {
      linePositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
      linePositions.push(positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]);
    }
  }
}

lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
group.add(lines);

camera.position.z = 5;

function animate() {
  requestAnimationFrame(animate);
  group.rotation.y += 0.001;
  group.rotation.x += 0.0005;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
