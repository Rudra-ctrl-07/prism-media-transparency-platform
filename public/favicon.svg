<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Neo-brutalist pixel skull: black canvas, yellow skull, black eyes -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <rect x="2" y="2" width="28" height="28" fill="#ffe600"/>
  <!-- Skull outline (rows 4-27) -->
  <rect x="8" y="4" width="16" height="2" fill="#0a0a0a"/>
  <rect x="6" y="6" width="20" height="2" fill="#0a0a0a"/>
  <rect x="4" y="8" width="24" height="2" fill="#0a0a0a"/>
  <rect x="3" y="10" width="26" height="2" fill="#0a0a0a"/>
  <rect x="2" y="12" width="28" height="2" fill="#0a0a0a"/>
  <rect x="2" y="14" width="28" height="2" fill="#0a0a0a"/>
  <rect x="2" y="16" width="28" height="2" fill="#0a0a0a"/>
  <rect x="3" y="18" width="26" height="2" fill="#0a0a0a"/>
  <rect x="4" y="20" width="24" height="2" fill="#0a0a0a"/>
  <rect x="5" y="22" width="22" height="2" fill="#0a0a0a"/>
  <rect x="7" y="24" width="18" height="2" fill="#0a0a0a"/>
  <rect x="9" y="26" width="14" height="2" fill="#0a0a0a"/>
  <!-- Eye sockets (black) -->
  <rect x="6" y="12" width="6" height="4" fill="#0a0a0a"/>
  <rect x="20" y="12" width="6" height="4" fill="#0a0a0a"/>
  <!-- Nose -->
  <rect x="14" y="16" width="4" height="4" fill="#0a0a0a"/>
  <!-- Jaw/teeth gaps -->
  <rect x="10" y="22" width="2" height="2" fill="#0a0a0a"/>
  <rect x="14" y="22" width="2" height="2" fill="#0a0a0a"/>
  <rect x="18" y="22" width="2" height="2" fill="#0a0a0a"/>
  <!-- Pink arcade accent tooth -->
  <rect x="14" y="24" width="2" height="2" fill="#ff4fd8"/>
</svg>
